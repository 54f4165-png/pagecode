.dialog .status-icon{top:38%!important;left:37%!important;width:26%!important;height:12%!important;display:flex!important;align-items:center!important;justify-content:center!important;line-height:1!important}
.dialog .success-check-image{display:block!important;width:auto!important;height:100%!important;max-width:100%!important;object-fit:contain!important;filter:none!important}
.dialog .error-cross{font-family:Arial,Helvetica,sans-serif!important;font-size:clamp(25px,7cqw,42px)!important;font-weight:900!important;color:#f34a6a!important;text-shadow:0 2px 2px #9a234b33!important}
.dialog h2{top:51%!important;left:12%!important;width:76%!important;font-size:clamp(12px,3.3cqw,18px)!important;line-height:1.2!important;font-weight:900!important;margin:0!important;white-space:normal!important;overflow-wrap:break-word!important}
.dialog .message{top:59%!important;left:13%!important;width:74%!important;max-height:12%!important;font-size:clamp(11px,2.9cqw,16px)!important;line-height:1.22!important;font-weight:800!important;overflow-wrap:break-word!important;word-break:normal!important;overflow-x:hidden!important;overflow-y:auto!important;margin:0!important}
.dialog .reward{top:72%!important;left:15%!important;width:70%!important;font-size:clamp(17px,4.1cqw,24px)!important;line-height:1.15!important;font-weight:900!important;color:#f58b00!important;white-space:nowrap!important}
.dialog > div:has(> #close){bottom:8.5%!important}
.dialog #close{font-size:clamp(12px,3cqw,16px)!important}
@media(max-width:520px){.dialog .status-icon{top:38%!important}.dialog h2{top:51%!important}.dialog .message{top:59%!important;max-height:13%!important}.dialog .reward{top:72%!important}}
</style></head><body><header class="site-header"><div class="logo">E39</div><nav class="nav" aria-label="Điều hướng"><a href="#" data-link="home"><span class="ico">🏠</span>Trang Chủ</a><a href="#" data-link="contact"><span class="ico">📣</span>Liên Hệ</a><a href="#" data-link="telegram"><span class="ico">✈️</span>Telegram</a><a href="#" data-link="fanpage"><span class="ico">🟠</span>Fanpage</a></nav></header><main class="stage"><div class="center"><div class="code-panel"><form class="code-form" id="desktopForm"><div class="group"><label for="account">Nhập tên tài khoản</label><div class="line"><span>♟</span><input id="account" name="account" placeholder="Nhập tài khoản" required autocomplete="username"></div></div><div class="group"><label for="code">Điền mã code nhận thưởng</label><div class="line"><span>▣</span><input id="code" name="code" placeholder="Mã code" maxlength="6" minlength="6" pattern="[A-Za-z]{6}" required></div></div><div class="verification"><div class="verify-widget"></div><div class="verify-setup">Xác minh Cloudflare chưa được cấu hình</div></div><button class="submit" type="submit">KIỂM TRA NGAY</button></form></div></div></main><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="dialog" id="dialog"><div class="status-icon" id="icon" aria-label="Trạng thái">❌</div><h2 id="resultTitle">NHẬP MÃ KHUYẾN MÃI</h2><p class="message" id="message">MÃ CODE KHÔNG HỢP LỆ</p><div class="reward" id="reward" hidden></div><div><button type="button" id="close">XÁC NHẬN</button></div><div class="note" id="note"></div></div></div><script>
if ('scrollRestoration' in history) history.scrollRestoration='manual';
window.addEventListener('load',function(){if(!location.hash)window.scrollTo(0,0)},{once:true});
</script><script src="config.js"></script><script>
// Supply a secure server-side verification endpoint. Never embed valid codes or API secrets in public HTML.
const API_URL='/api/verify';
// Dán Site Key công khai từ Cloudflare Turnstile (không dán Secret Key ở đây).
const TURNSTILE_SITE_KEY=window.E39_CONFIG?.turnstileSiteKey || '';
const turnstileIds=new Map();
let turnstileLoaded=false;
function onTurnstileLoaded(){turnstileLoaded=true;setupTurnstile()}
function setupTurnstile(){if(!turnstileLoaded||!TURNSTILE_SITE_KEY)return;document.querySelectorAll('.verification').forEach((wrap,i)=>{if(turnstileIds.has(wrap))return;wrap.querySelector('.verify-setup').hidden=true;wrap.classList.add('is-ready');const id=turnstile.render(wrap.querySelector('.verify-widget'),{sitekey:TURNSTILE_SITE_KEY,theme:'light',size:'normal','expired-callback':()=>{},'error-callback':()=>{}});turnstileIds.set(wrap,id)})}

const links={home:'',contact:'',telegram:'',fanpage:''};
document.querySelectorAll('[data-link]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();let url=links[el.dataset.link];if(url)location.href=url;else alert('Liên kết chưa được cấu hình.')}));
const modal=document.getElementById('modal'),dialog=document.getElementById('dialog');
function result(data){let ok=data.valid===true;dialog.classList.toggle('success',ok);document.getElementById('icon').innerHTML=ok?'<img src="e39-success-check.webp" alt="Thành công" class="success-check-image">':'<span class="error-cross" aria-label="Lỗi">✕</span>'; document.getElementById('resultTitle').textContent=ok?'CHÚC MỪNG':'NHẬP MÃ KHUYẾN MÃI';document.getElementById('message').textContent=ok?((data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit'))?'Bạn đã nhận được':'MÃ CODE HỢP LỆ'):data.reason==='code_expired'?'CODE ĐÃ HẾT HẠN':data.reason==='code_not_configured'?'CODE CHƯA ĐƯỢC KÍCH HOẠT':data.reason==='generated_code_requires_deposit'?'TÀI KHOẢN CỦA BẠN CHƯA NẠP TIỀN NÊN KHÔNG THỂ NHẬN CODE':data.reason==='deposit_required'?'TÀI KHOẢN CỦA BẠN CẦN NẠP ĐỦ '+new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' VND ĐỂ NHẬN CODE NÀY':data.reason==='account_not_found'?'TÀI KHOẢN KHÔNG TỒN TẠI':['invalid_code','code_used','code_expired','already_redeemed','expired_code','used_code'].includes(data.reason)?'CODE ĐÃ SỬ DỤNG HẾT HOẶC ĐÃ HẾT HẠN':data.reason==='turnstile_not_configured'?'CHƯA CẤU HÌNH XÁC MINH CLOUDFLARE':data.reason==='code_service_not_configured'?'CHƯA KẾT NỐI DỮ LIỆU MÃ':'CHƯA THỂ XÁC MINH MÃ';let reward=document.getElementById('reward');reward.hidden=!(ok&&(data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit')));reward.textContent=ok&&(data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit'))?new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' VNĐ':'';document.getElementById('note').textContent='';modal.hidden=false;document.getElementById('close').focus()}
document.getElementById('close').addEventListener('click',()=>modal.hidden=true);modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true});
async function submit(form){const account=form.elements.account.value.trim(),code=form.elements.code.value.trim();if(!account||!code)return;if(!TURNSTILE_SITE_KEY){result({valid:false,reason:'service_unavailable',note:'Chưa cấu hình Cloudflare Turnstile Site Key.'});return;}const wrap=form.querySelector('.verification');const widgetId=turnstileIds.get(wrap);const token=widgetId!==undefined&&window.turnstile?turnstile.getResponse(widgetId):'';if(!token){result({valid:false,reason:'service_unavailable',note:'Vui lòng hoàn tất xác minh Cloudflare trước khi kiểm tra.'});return;}if(!API_URL){result({valid:false,reason:'service_unavailable',note:'Chưa kết nối máy chủ xác minh mã code.'});return;}let button=form.querySelector('[type=submit]');button.disabled=true;try{let response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account,code,turnstileToken:token})});let data=await response.json();if(!response.ok&&typeof data.valid!=='boolean')throw Error('HTTP '+response.status);if(typeof data.valid!=='boolean')throw Error('Invalid result');result(data)}catch(e){result({valid:false,reason:'service_unavailable',note:''})}finally{button.disabled=false;if(widgetId!==undefined&&window.turnstile)turnstile.reset(widgetId)}}
document.getElementById('desktopForm').addEventListener('submit',e=>{e.preventDefault();submit(e.currentTarget)});
</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoaded&render=explicit" async defer></script>
