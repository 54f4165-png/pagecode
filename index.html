<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E39 | Page nhập code</title><meta name="theme-color" content="#ff8718"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fff6ea}.stage{position:relative;width:100%;aspect-ratio:1903/911;background:url('reference.png') center top/100% 100% no-repeat;overflow:hidden}.field{position:absolute;left:36.45%;width:27.2%;height:4.65%;border:0;background:#fff;border-radius:12px;padding:0 1.1%;font-size:clamp(11px,0.83vw,17px);color:#333;outline:none}.field:focus{box-shadow:inset 0 0 0 2px #ff890c}.account{top:43.1%}.code{top:51.65%}.submit{position:absolute;left:43.1%;top:63.15%;width:13.8%;height:6.3%;border:0;border-radius:50px;background:transparent;cursor:pointer}.submit:focus-visible,.nav:focus-visible{outline:3px solid #124fc1;outline-offset:3px}.nav{position:absolute;top:1.5%;height:6%;cursor:pointer;border:0;background:transparent}.home{left:41%;width:8%}.contact{left:49.8%;width:8%}.telegram{left:58.2%;width:9%}.fanpage{left:66.4%;width:8.5%}.status{position:absolute;left:35%;top:72%;width:30%;padding:12px;background:#fffdf4;border:2px solid #ff981b;border-radius:12px;text-align:center;color:#9d4400;font-weight:700;font-size:clamp(12px,1vw,18px);box-shadow:0 5px 20px #0002}.status[hidden]{display:none}.smallnote{font-size:12px;font-weight:400;margin-top:5px}@media(max-width:700px){.stage{width:100%;height:100svh;aspect-ratio:auto;background-size:auto 100%;background-position:center}.mobile{position:absolute;inset:0;background:linear-gradient(#fff9eeef,#fff3e9e0);display:flex;flex-direction:column;align-items:center;padding:20px 16px}.mobile header{width:100%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:42px;font-weight:1000;color:#ff8115}.mobile header a{font-size:13px;color:#70421c;text-decoration:none}.mobile .form{margin:auto 0;width:min(100%,430px);padding:25px 20px;border:5px solid #ffb51f;border-radius:28px;background:#fff9ed;box-shadow:0 12px 40px #bc680b45}.mobile h1{text-align:center;color:#f97300;text-shadow:1px 2px #ffc577;font-size:34px;margin:0 0 25px}.mobile label{display:block;font-size:14px;font-weight:700;color:#ff7300;margin:15px 0 8px}.mobile input{width:100%;height:48px;border:2px solid #ff9b24;border-radius:12px;padding:0 13px;font-size:16px}.mobile button{width:100%;margin-top:24px;border:3px solid #ffd9a1;background:linear-gradient(#ffb84c,#ff7c13);border-radius:30px;color:#fff;font-size:23px;font-weight:900;padding:12px}.mobile .message{margin-top:15px;text-align:center;color:#a64d00;font-weight:700}.desktop{display:none!important}}@media(min-width:701px){.mobile{display:none}}
</style></head><body><main class="stage"><div class="desktop"><button class="nav home" aria-label="Trang chủ" data-link="home"></button><button class="nav contact" aria-label="Liên hệ" data-link="contact"></button><button class="nav telegram" aria-label="Telegram" data-link="telegram"></button><button class="nav fanpage" aria-label="Fanpage" data-link="fanpage"></button><form id="desktopForm"><input class="field account" name="account" aria-label="Nhập tài khoản" placeholder="Nhập tài khoản" required autocomplete="username"><input class="field code" name="code" aria-label="Mã code" placeholder="Mã code" required><button class="submit" aria-label="Kiểm tra ngay" type="submit"></button></form><div class="status" id="desktopStatus" role="status" hidden></div></div><div class="mobile"><header><span class="brand">E39</span><a href="#" data-link="home">Trang Chủ</a><a href="#" data-link="contact">Liên Hệ</a><a href="#" data-link="telegram">Telegram</a><a href="#" data-link="fanpage">Fanpage</a></header><form class="form" id="mobileForm"><h1>Page nhập code 🎁</h1><label for="mobileAccount">Nhập tên tài khoản</label><input id="mobileAccount" name="account" placeholder="Nhập tài khoản" required><label for="mobileCode">Điền mã code nhận thưởng</label><input id="mobileCode" name="code" placeholder="Mã code" required><button type="submit">KIỂM TRA NGAY</button><p class="message" id="mobileStatus" role="status"></p></form></div></main><script>
// Thay các URL bên dưới bằng liên kết chính thức của bạn.
const links={home:'',contact:'',telegram:'',fanpage:''};
document.querySelectorAll('[data-link]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();const url=links[el.dataset.link];if(url)location.href=url;else alert('Chưa cấu hình liên kết '+el.getAttribute('aria-label')+'.');}));
function handle(form,output){form.addEventListener('submit',e=>{e.preventDefault();const account=form.elements.account.value.trim(),code=form.elements.code.value.trim();if(!account||!code){output.textContent='Vui lòng nhập tài khoản và mã code.';}else{output.textContent='Đã ghi nhận thông tin nhập. Chưa kết nối hệ thống xác minh mã code.';}output.hidden=false;});}
handle(document.getElementById('desktopForm'),document.getElementById('desktopStatus'));handle(document.getElementById('mobileForm'),document.getElementById('mobileStatus'));
</script></body></html>
