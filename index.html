<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>E39 | Page nhập code</title><meta name="theme-color" content="#ff8818"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff7eb}.stage{position:relative;width:100%;aspect-ratio:1903/911;background:url('reference.png') center top/100% 100% no-repeat;overflow:hidden}.nav{position:absolute;top:1.3%;height:6%;border:0;background:transparent;cursor:pointer}.home{left:41%;width:8%}.contact{left:49.7%;width:8%}.telegram{left:58.1%;width:9%}.fanpage{left:66.4%;width:9%}.form-panel{position:absolute;left:32.85%;top:37.9%;width:28.55%;height:32.1%;background:linear-gradient(#fffaf0,#fff9ef);border:3px solid #ffe5ae;border-radius:5.5% / 10%;padding:1.15% 1.3% .6%;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 9px #cc820e22}.field-group{display:flex;flex-direction:column;gap:4px}.field-group label{color:#ff6900;font-weight:700;font-size:clamp(10px,.86vw,16px)}.input-wrap{display:flex;align-items:center;gap:10px;border:2px solid #ff8b1a;border-radius:12px;background:white;height:clamp(25px,4.7vh,46px);padding:0 12px}.input-wrap svg{width:17px;height:17px;flex-shrink:0;fill:#555}.input-wrap input{width:100%;min-width:0;border:0;outline:0;font-size:clamp(11px,.8vw,15px);color:#303030;background:transparent}.input-wrap:focus-within{box-shadow:0 0 0 2px #ffd59b}.verification{height:clamp(23px,4.4vh,43px);width:46%;align-self:center;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #e0e0e0;background:#f8f8f8;color:#555;font-size:clamp(8px,.59vw,11px)}.verification svg{width:16px;fill:#777}.check{align-self:center;border:3px solid #ffdc9e;border-radius:40px;background:linear-gradient(#ffbd62 0%,#ff8e1e 48%,#ff7310 100%);box-shadow:0 0 0 2px #fff6df,0 3px 8px #d8731a88,inset 0 2px 4px #fff9;color:white;font-weight:900;text-shadow:0 2px 1px #db5a0a;font-size:clamp(12px,1.45vw,28px);height:clamp(30px,6.4vh,59px);padding:0 5%;cursor:pointer;white-space:nowrap}.check:hover{filter:brightness(1.06)}.check:focus-visible,.nav:focus-visible{outline:3px solid #1757c5;outline-offset:2px}/* Result dialog */
.result-overlay[hidden]{display:none!important}.result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:18px}.result-box{position:relative;width:min(460px,95vw);min-height:310px;background:linear-gradient(#fff,#fffaf4);border:7px ridge #ff8b18;border-radius:38px;box-shadow:0 0 0 3px #fff0bb,0 12px 35px #0006,inset 0 0 15px #ffd9ad;text-align:center;padding:68px 22px 26px}.result-box:before{content:'🎁';position:absolute;top:-55px;left:50%;transform:translateX(-50%);font-size:85px;filter:drop-shadow(0 4px 2px #a64b1b)}.result-icon{font-size:46px;line-height:1.1}.result-title{font-size:20px;color:#46566b;font-weight:900;margin:10px 0 5px}.result-message{font-size:19px;color:#ed3434;font-weight:900;margin:0 0 16px}.result-box.success .result-message{color:#12a96a}.reward{display:inline-block;background:#fffdf4;border-radius:28px;padding:6px 34px;color:#ff8c00;font-size:29px;font-weight:900;margin:0 0 16px}.result-box button{border:2px solid #ffad39;border-radius:12px;background:linear-gradient(#ffbd4b,#ff7d13);color:white;padding:12px 35px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 3px 5px #c35b1b88}.result-note{font-size:12px;color:#777;margin:12px 0 0}.result-box.success .result-title{color:#0ba76a}
.watermark-cover{position:absolute;right:1.8%;bottom:3%;width:16%;height:8%;backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);border-radius:12px;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}.mobile{display:none}
@media(max-width:700px){.stage{min-height:100svh;aspect-ratio:auto;background-size:auto 100%;background-position:center}.desktop{display:none}.mobile{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 14px;background:linear-gradient(#fff9efdd,#fff5e9b8)}.mobile-header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.mobile-header strong{font-size:39px;color:#ff8317;font-weight:1000}.mobile-links{display:flex;gap:10px;flex-wrap:wrap}.mobile-links a{color:#73451b;font-size:12px;text-decoration:none;font-weight:bold}.mobile-form{margin:auto 0;background:#fff9ed;border:5px solid #ffb62b;border-radius:27px;padding:25px 18px;box-shadow:0 12px 35px #c27b1a55}.mobile-form h1{text-align:center;font-size:32px;color:#ff7a0b;text-shadow:1px 2px #ffd28d;margin:0 0 22px}.mobile-form label{display:block;color:#ff7000;font-size:14px;font-weight:bold;margin:14px 0 7px}.mobile-form input{width:100%;height:47px;padding:0 12px;border:2px solid #ff9224;border-radius:12px;font-size:16px}.mobile-form .verification{width:210px;height:42px;margin:18px auto}.mobile-form button{width:100%;padding:12px 8px;border:3px solid #ffdda4;border-radius:40px;background:linear-gradient(#ffbc5a,#ff7b0d);color:#fff;font-size:23px;font-weight:900}.mobile-status{text-align:center;color:#934c00;font-weight:bold;font-size:13px}}
</style></head><body><main class="stage"><div class="desktop"><button class="nav home" data-link="home" aria-label="Trang Chủ"></button><button class="nav contact" data-link="contact" aria-label="Liên Hệ"></button><button class="nav telegram" data-link="telegram" aria-label="Telegram"></button><button class="nav fanpage" data-link="fanpage" aria-label="Fanpage"></button><form class="form-panel" id="desktopForm"><div class="field-group"><label for="account">Nhập tên tài khoản</label><div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-5 0-8 2.5-8 5v1h16v-1c0-2.5-3-5-8-5Z"/></svg><input id="account" name="account" placeholder="Nhập tài khoản" autocomplete="username" required></div></div><div class="field-group"><label for="code">Điền mã code nhận thưởng</label><div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v13H4V8Zm2-5h12v3H6V3Zm3 8v2h6v-2H9Zm0 4v2h9v-2H9Z"/></svg><input id="code" name="code" placeholder="Mã code" required></div></div><div class="verification" aria-label="Chưa tích hợp xác minh"><svg viewBox="0 0 24 24"><path d="M12 2 3 6v6c0 5.5 3.8 9.5 9 10 5.2-.5 9-4.5 9-10V6l-9-4Zm-1 5h2v7h-2V7Zm0 9h2v2h-2v-2Z"/></svg><span>Chưa kết nối xác minh</span></div><button class="check" type="submit">KIỂM TRA NGAY</button></form><div class="watermark-cover" aria-hidden="true"></div></div><div class="mobile"><header class="mobile-header"><strong>E39</strong><nav class="mobile-links"><a href="#" data-link="home">Trang Chủ</a><a href="#" data-link="contact">Liên Hệ</a><a href="#" data-link="telegram">Telegram</a><a href="#" data-link="fanpage">Fanpage</a></nav></header><form class="mobile-form" id="mobileForm"><h1>Page nhập code 🎁</h1><label for="mAccount">Nhập tên tài khoản</label><input id="mAccount" name="account" placeholder="Nhập tài khoản" required><label for="mCode">Điền mã code nhận thưởng</label><input id="mCode" name="code" placeholder="Mã code" required><div class="verification">Chưa kết nối xác minh</div><button type="submit">KIỂM TRA NGAY</button></form></div></main><div class="result-overlay" id="resultOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="result-box" id="resultBox"><div class="result-icon" id="resultIcon">❌</div><h2 class="result-title" id="resultTitle">NHẬP MÃ KHUYẾN MÃI</h2><p class="result-message" id="resultMessage">MÃ CODE KHÔNG HỢP LỆ</p><div class="reward" id="resultReward" hidden></div><div><button id="resultClose" type="button">XÁC NHẬN</button></div><p class="result-note" id="resultNote"></p></div></div><script>
// Điền API_URL để xác minh thật trên máy chủ của bạn. API phải trả JSON:
// {"valid":true,"amount":58,"currency":"VND"} hoặc {"valid":false,"reason":"invalid_code"|"account_not_found"}.
// Không lưu danh sách mã hợp lệ hoặc khóa bí mật trong HTML công khai.
const API_URL = '';
const links={home:'',contact:'',telegram:'',fanpage:''};
document.querySelectorAll('[data-link]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();const url=links[el.dataset.link];if(url)location.href=url;else alert('Liên kết này chưa được cấu hình.')}));
const overlay=document.getElementById('resultOverlay'), box=document.getElementById('resultBox'), icon=document.getElementById('resultIcon'), title=document.getElementById('resultTitle'),message=document.getElementById('resultMessage'),reward=document.getElementById('resultReward'),note=document.getElementById('resultNote');
function showResult(data){
 const valid=data.valid===true;box.classList.toggle('success',valid);icon.textContent=valid?'✅':'❌';title.textContent=valid?'CHÚC MỪNG':'NHẬP MÃ KHUYẾN MÃI';
 message.textContent=valid?'Bạn đã nhận được':data.reason==='account_not_found'?'TÀI KHOẢN KHÔNG TỒN TẠI':data.reason==='missing'?'VUI LÒNG NHẬP ĐỦ THÔNG TIN':data.reason==='service_unavailable'?'CHƯA THỂ XÁC MINH MÃ':'MÃ CODE KHÔNG HỢP LỆ';
 reward.hidden=!valid;reward.textContent=valid?new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' '+(data.currency||'VND'):'';
 note.textContent=data.note||'';overlay.hidden=false;document.getElementById('resultClose').focus();
}
document.getElementById('resultClose').addEventListener('click',()=>overlay.hidden=true);
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.hidden=true});
async function submit(form){
 const account=form.elements.account.value.trim(),code=form.elements.code.value.trim();
 if(!account||!code){showResult({valid:false,reason:'missing'});return;}
 if(!API_URL){showResult({valid:false,reason:'service_unavailable',note:'Cần kết nối API xác minh để kiểm tra mã và hiển thị phần thưởng thực tế.'});return;}
 const button=form.querySelector('[type=submit]');button.disabled=true;
 try{const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account,code})});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(typeof data.valid!=='boolean')throw Error('Invalid response');showResult(data)}catch(e){showResult({valid:false,reason:'service_unavailable',note:'Vui lòng thử lại sau.'})}finally{button.disabled=false}
}
for(const id of ['desktopForm','mobileForm'])document.getElementById(id).addEventListener('submit',e=>{e.preventDefault();submit(e.currentTarget)});
</script></body></html>
