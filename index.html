<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>E39 - Page nhập code</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff7ed}body{overflow-x:hidden}
.site-header{height:78px;background:#fff;display:flex;align-items:center;justify-content:center;gap:clamp(24px,6vw,100px);padding:10px 18px;box-shadow:0 1px 5px #ad772c24;position:relative;z-index:2}.logo{font-weight:1000;color:#ff861b;font-size:clamp(34px,3.7vw,56px);letter-spacing:-3px;line-height:1}.nav{display:flex;align-items:center;gap:clamp(12px,3vw,44px)}.nav a{display:flex;align-items:center;gap:7px;color:#303746;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}.nav .ico{font-size:22px;background:#fff1d9;border-radius:9px;padding:3px;box-shadow:0 1px 3px #cc8a3d66}
.stage{min-height:calc(100svh - 78px);background-image:url('e39-background-clean.webp');background-repeat:no-repeat;background-position:center center;background-size:cover;display:flex;align-items:center;justify-content:center;padding:28px 15px 42px;position:relative}.center{width:min(560px,100%);text-align:center;position:relative;z-index:1}.title{margin:0 0 12px;font-size:clamp(29px,3.5vw,52px);font-weight:1000;font-style:italic;color:#fff;line-height:1.08;white-space:nowrap;-webkit-text-stroke:1.2px #e16b00;text-shadow:0 3px #ffac24,0 6px #a84a0c,1px 9px 6px #8a460c70}.gift{display:block;font-size:40px;margin-bottom:7px;font-style:normal;-webkit-text-stroke:0;text-shadow:none}
.code-panel{border-radius:27px;padding:20px;background:linear-gradient(165deg,#ffda55,#ffad15);border:3px solid #ec8e09;box-shadow:0 8px 0 #c97616,0 18px 30px #87470040}.code-form{background:linear-gradient(#fffdf8,#fff5e6);border:3px solid #fff1cc;border-radius:21px;padding:24px 23px 21px;box-shadow:inset 0 0 14px #f3a53566;display:flex;flex-direction:column;gap:11px;text-align:left}.group label{display:block;color:#ef720b;font-size:15px;font-weight:800;margin-bottom:6px}.line{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #ff9a25;border-radius:10px;height:48px;padding:0 12px}.line span{color:#6d6d6d}.line input{border:0;outline:0;background:transparent;width:100%;min-width:0;height:100%;font-size:16px;color:#252525}.line:focus-within{box-shadow:0 0 0 3px #ffca7877}.verification{min-height:70px;display:flex;align-items:center;justify-content:center;flex-direction:column;max-width:100%;overflow:visible}.verify-widget{display:flex;justify-content:center;max-width:100%}.verify-setup{font-size:12px;color:#835b36;text-align:center}.submit{align-self:center;width:min(100%,310px);min-height:52px;border:3px solid #ffe1a3;border-radius:32px;background:linear-gradient(#ffca6a,#ff8111);box-shadow:0 4px 0 #cf6d11,0 6px 12px #ad641d66;color:white;font-size:clamp(18px,2.2vw,23px);font-weight:900;text-shadow:0 1px #ad5200;cursor:pointer}.submit:disabled{opacity:.7;cursor:wait}
.modal[hidden]{display:none}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:20px}.dialog{position:relative;background:linear-gradient(#fff,#fffaf4);border:7px ridge #ff8b18;border-radius:35px;box-shadow:0 0 0 3px #fff0bb,0 15px 45px #0005;text-align:center;width:min(460px,94vw);padding:70px 20px 32px}.dialog:before{content:'🎁';position:absolute;top:-56px;left:50%;transform:translateX(-50%);font-size:85px}.status-icon{font-size:42px}.dialog h2{font-size:19px;color:#46566b;margin:8px 0}.message{font-size:20px;line-height:1.4;color:#ec3434;font-weight:800;margin:0 0 15px;overflow-wrap:break-word}.dialog.success h2,.dialog.success .message{color:#0aab71}.reward{display:inline-block;background:#fffdf1;border-radius:40px;padding:6px 35px;color:#ff9000;font-size:30px;font-weight:900;margin:0 0 14px}.reward[hidden]{display:none}.dialog button{border:2px solid #ffad39;border-radius:12px;background:linear-gradient(#ffbd4b,#ff7d13);color:#fff;font-size:17px;font-weight:900;padding:12px 35px;cursor:pointer}.note{display:none!important}
@media(max-width:700px){.site-header{height:auto;min-height:95px;flex-direction:column;gap:7px;padding:7px 5px 9px}.logo{font-size:37px}.nav{gap:clamp(5px,2vw,14px);width:100%;justify-content:space-evenly}.nav a{font-size:clamp(10px,2.5vw,13px);gap:3px}.nav .ico{font-size:15px;padding:2px}.stage{min-height:calc(100svh - 95px);align-items:flex-start;padding:clamp(24px,7vh,75px) 12px 30px;background-position:center center;background-size:cover}.center{width:min(480px,100%)}.title{font-size:clamp(27px,7vw,39px);margin-bottom:10px}.gift{font-size:30px;margin-bottom:4px}.code-panel{padding:10px;border-radius:22px}.code-form{padding:17px 13px 18px;border-radius:17px;gap:11px}.group label{font-size:14px}.line{height:47px}.submit{font-size:20px}.verification{min-height:70px}}
@media(max-width:360px){.nav a{font-size:10px}.nav .ico{font-size:13px}.stage{padding-left:7px;padding-right:7px}.code-form{padding:13px 9px}.title{font-size:26px}.verification{transform:scale(.91);transform-origin:center}}
</style></head><body><header class="site-header"><div class="logo">E39</div><nav class="nav" aria-label="Điều hướng"><a href="#" data-link="home"><span class="ico">🏠</span>Trang Chủ</a><a href="#" data-link="contact"><span class="ico">📣</span>Liên Hệ</a><a href="#" data-link="telegram"><span class="ico">✈️</span>Telegram</a><a href="#" data-link="fanpage"><span class="ico">🟠</span>Fanpage</a></nav></header><main class="stage"><div class="center"><h1 class="title"><span class="gift">🎁</span>Page nhập code</h1><div class="code-panel"><form class="code-form" id="desktopForm"><div class="group"><label for="account">Nhập tên tài khoản</label><div class="line"><span>♟</span><input id="account" name="account" placeholder="Nhập tài khoản" required autocomplete="username"></div></div><div class="group"><label for="code">Điền mã code nhận thưởng</label><div class="line"><span>▣</span><input id="code" name="code" placeholder="Mã code" maxlength="6" minlength="6" pattern="[A-Za-z]{6}" required></div></div><div class="verification"><div class="verify-widget"></div><div class="verify-setup">Xác minh Cloudflare chưa được cấu hình</div></div><button class="submit" type="submit">KIỂM TRA NGAY</button></form></div></div></main><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="dialog" id="dialog"><div class="status-icon" id="icon">❌</div><h2 id="resultTitle">NHẬP MÃ KHUYẾN MÃI</h2><p class="message" id="message">MÃ CODE KHÔNG HỢP LỆ</p><div class="reward" id="reward" hidden></div><div><button type="button" id="close">XÁC NHẬN</button></div><div class="note" id="note"></div></div></div><script src="config.js"></script><script>
// Supply a secure server-side verification endpoint. Never embed valid codes or API secrets in public HTML.
const API_URL='/api/verify';
// Dán Site Key công khai từ Cloudflare Turnstile (không dán Secret Key ở đây).
const TURNSTILE_SITE_KEY=window.E39_CONFIG?.turnstileSiteKey || '';
const turnstileIds=new Map();
let turnstileLoaded=false;
function onTurnstileLoaded(){turnstileLoaded=true;setupTurnstile()}
function setupTurnstile(){if(!turnstileLoaded||!TURNSTILE_SITE_KEY)return;document.querySelectorAll('.verification').forEach((wrap,i)=>{if(turnstileIds.has(wrap))return;wrap.querySelector('.verify-setup').hidden=true;wrap.classList.add('is-ready');const id=turnstile.render(wrap.querySelector('.verify-widget'),{sitekey:TURNSTILE_SITE_KEY,theme:'light',size:'normal','expired-callback':()=>{},'error-callback':()=>{}});turnstileIds.set(wrap,id)})}

const links={home:'',contact:'',telegram:'',fanpage:''};
document.querySelectorAll('[data-link]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();let url=links[el.dataset.link];if(url)location.href=url;else alert('Liên kết chưa được cấu hình.')}));
const modal=document.getElementById('modal'),dialog=document.getElementById('dialog');
function result(data){let ok=data.valid===true;dialog.classList.toggle('success',ok);document.getElementById('icon').textContent=ok?'✅':'❌';document.getElementById('resultTitle').textContent=ok?'CHÚC MỪNG':'NHẬP MÃ KHUYẾN MÃI';document.getElementById('message').textContent=ok?((data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit'))?'Bạn đã nhận được':'MÃ CODE HỢP LỆ'):data.reason==='code_expired'?'CODE ĐÃ HẾT HẠN':data.reason==='code_not_configured'?'CODE CHƯA ĐƯỢC KÍCH HOẠT':data.reason==='generated_code_requires_deposit'?'TÀI KHOẢN CỦA BẠN CHƯA NẠP TIỀN NÊN KHÔNG THỂ NHẬN CODE':data.reason==='deposit_required'?'TÀI KHOẢN CỦA BẠN CẦN NẠP ĐỦ '+new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' VND ĐỂ NHẬN CODE NÀY':data.reason==='account_not_found'?'TÀI KHOẢN KHÔNG TỒN TẠI':['invalid_code','code_used','code_expired','already_redeemed','expired_code','used_code'].includes(data.reason)?'CODE ĐÃ SỬ DỤNG HẾT HOẶC ĐÃ HẾT HẠN':data.reason==='turnstile_not_configured'?'CHƯA CẤU HÌNH XÁC MINH CLOUDFLARE':data.reason==='code_service_not_configured'?'CHƯA KẾT NỐI DỮ LIỆU MÃ':'CHƯA THỂ XÁC MINH MÃ';let reward=document.getElementById('reward');reward.hidden=!(ok&&(data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit')));reward.textContent=ok&&(data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit'))?new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' VNĐ':'';document.getElementById('note').textContent='';modal.hidden=false;document.getElementById('close').focus()}
document.getElementById('close').addEventListener('click',()=>modal.hidden=true);modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true});
async function submit(form){const account=form.elements.account.value.trim(),code=form.elements.code.value.trim();if(!account||!code)return;if(!TURNSTILE_SITE_KEY){result({valid:false,reason:'service_unavailable',note:'Chưa cấu hình Cloudflare Turnstile Site Key.'});return;}const wrap=form.querySelector('.verification');const widgetId=turnstileIds.get(wrap);const token=widgetId!==undefined&&window.turnstile?turnstile.getResponse(widgetId):'';if(!token){result({valid:false,reason:'service_unavailable',note:'Vui lòng hoàn tất xác minh Cloudflare trước khi kiểm tra.'});return;}if(!API_URL){result({valid:false,reason:'service_unavailable',note:'Chưa kết nối máy chủ xác minh mã code.'});return;}let button=form.querySelector('[type=submit]');button.disabled=true;try{let response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account,code,turnstileToken:token})});let data=await response.json();if(!response.ok&&typeof data.valid!=='boolean')throw Error('HTTP '+response.status);if(typeof data.valid!=='boolean')throw Error('Invalid result');result(data)}catch(e){result({valid:false,reason:'service_unavailable',note:''})}finally{button.disabled=false;if(widgetId!==undefined&&window.turnstile)turnstile.reset(widgetId)}}
document.getElementById('desktopForm').addEventListener('submit',e=>{e.preventDefault();submit(e.currentTarget)});
</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoaded&render=explicit" async defer></script></body></html>
