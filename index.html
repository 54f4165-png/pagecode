.modal[hidden]{display:none}.modal{position:fixed;inset:0;background:#000b;z-index:10;display:grid;place-items:center;padding:20px}.dialog{position:relative;background:linear-gradient(#fff,#fffaf4);border:7px ridge #ff8b18;border-radius:35px;box-shadow:0 0 0 3px #fff0bb,0 15px 45px #0005;text-align:center;width:min(460px,94vw);padding:70px 20px 32px}.dialog:before{content:'🎁';position:absolute;top:-56px;left:50%;transform:translateX(-50%);font-size:85px}.status-icon{font-size:42px}.dialog h2{font-family:Arial,Helvetica,sans-serif;font-size:clamp(16px,2.2vw,19px);font-weight:800;line-height:1.35;letter-spacing:0;color:#46566b;margin:8px 0}.message{font-family:Arial,Helvetica,sans-serif;font-size:clamp(17px,2.3vw,20px);line-height:1.4;letter-spacing:0;color:#ec3434;font-weight:800;margin:0 0 15px;overflow-wrap:break-word}.dialog.success h2,.dialog.success .message{color:#0aab71}.reward{display:inline-block;background:#fffdf1;border-radius:40px;padding:6px 35px;color:#ff9000;font-size:30px;font-weight:900;margin:0 0 14px}.reward[hidden]{display:none}.dialog button{font-family:Arial,Helvetica,sans-serif;line-height:1.2;border:2px solid #ffad39;border-radius:12px;background:linear-gradient(#ffbd4b,#ff7d13);color:#fff;font-size:17px;font-weight:900;padding:12px 35px;cursor:pointer}.note{display:none!important}
.verification{width: min(100%,300px);height:58px;min-height:58px;background:#fafafa;border:1px solid #d9d9d9;border-radius:3px;padding:4px;position:relative}.verify-widget{width:100%;display:flex;align-items:center;justify-content:center}.verify-setup{font-size:11px;text-align:center;line-height:1.4;color:#666;padding:5px}.verification.is-ready{background:#fff}.mobile{display:none}
@media(max-width:700px){.stage{min-height:100svh;aspect-ratio:auto;background-size:auto 100%;background-position:center}.desktop{display:none}.mobile{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px 14px;background:#fff8f0a8}.mobile-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.mobile-head strong{font-size:39px;color:#ff8317}.mobile-head nav{display:flex;flex-wrap:wrap;gap:9px}.mobile-head a{font-size:11px;font-weight:bold;color:#714d29;text-decoration:none}.mobile-card{margin:auto 0;border:5px solid #ffb82c;border-radius:26px;background:#fffaf2;padding:23px 18px;box-shadow:0 12px 35px #c27b1a66}.mobile-card h1{text-align:center;font-size:27px;color:#ff790b;margin:0 0 20px}.mobile-card label{display:block;font-weight:bold;color:#ff7000;margin:13px 0 7px;font-size:14px}.mobile-card input{width:100%;height:47px;border:2px solid #ff9224;border-radius:12px;padding:0 12px;font-size:16px}.mobile-card .verification{width:min(100%,300px);margin:18px auto;height:58px}.mobile-card .submit{width:100%;height:55px;font-size:22px}}

/* E39 FIX: a single form, with a reserved 65px Turnstile row (normal widget). */
@media(min-width:701px){
 .form{top:39.25%;height:35.1%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr) 65px minmax(40px,.85fr);row-gap:4px;justify-content:initial;padding:1.05% 1.45%;}
 .form .group{display:flex;flex-direction:column;min-height:0;justify-content:center;}

 .form .verification{width:300px;max-width:100%;height:65px;min-height:65px;align-self:center;justify-self:center;padding:0;overflow:hidden;}
 .form .submit{height:clamp(37px,3.1vw,55px);min-height:0;width:55%;align-self:center;justify-self:center;}
}

}

/* Modal typography fix: Vietnamese-friendly system font and consistent weights. */
.dialog, .dialog * {font-family:"Segoe UI",Arial,Helvetica,sans-serif!important;font-style:normal!important;font-variant:normal!important;text-transform:none;text-shadow:none!important;letter-spacing:0!important;}
.dialog {font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
.dialog h2 {font-size:20px!important;font-weight:700!important;line-height:1.45!important;margin:8px 0 5px!important;white-space:normal;}
.dialog .message {font-size:20px!important;font-weight:700!important;line-height:1.45!important;margin:0 0 16px!important;white-space:normal;}

</style></head><body><main class="stage"><div class="desktop"><button class="nav-hit" data-link="home" aria-label="Trang Chủ"></button><button class="nav-hit" data-link="contact" aria-label="Liên Hệ"></button><button class="nav-hit" data-link="telegram" aria-label="Telegram"></button><button class="nav-hit" data-link="fanpage" aria-label="Fanpage"></button><form class="form" id="desktopForm"><div class="group"><label for="account">Nhập tên tài khoản</label><div class="line"><span aria-hidden="true">♟</span><input id="account" name="account" placeholder="Nhập tài khoản" required autocomplete="username"></div></div><div class="group"><label for="code">Điền mã code nhận thưởng</label><div class="line"><span aria-hidden="true">▣</span><input id="code" name="code" placeholder="Ví dụ: SLFKSN" maxlength="6" minlength="6" pattern="[A-Za-z]{6}" required></div></div><div class="verification"><div class="verify-widget"></div><div class="verify-setup">Xác minh Cloudflare chưa được cấu hình</div></div><button class="submit" type="submit">KIỂM TRA NGAY</button></form></div><div class="mobile"><header class="mobile-head"><strong>E39</strong><nav><a href="#" data-link="home">Trang Chủ</a><a href="#" data-link="contact">Liên Hệ</a><a href="#" data-link="telegram">Telegram</a><a href="#" data-link="fanpage">Fanpage</a></nav></header><form class="mobile-card" id="mobileForm"><h1>Page nhập code 🎁</h1><label for="mAccount">Nhập tên tài khoản</label><input id="mAccount" name="account" placeholder="Nhập tài khoản" required><label for="mCode">Điền mã code nhận thưởng</label><input id="mCode" name="code" placeholder="Mã code" required><div class="verification"><div class="verify-widget"></div><div class="verify-setup">Xác minh Cloudflare chưa được cấu hình</div></div><button class="submit" type="submit">KIỂM TRA NGAY</button></form></div></main><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="dialog" id="dialog"><div class="status-icon" id="icon">❌</div><h2 id="resultTitle">NHẬP MÃ KHUYẾN MÃI</h2><p class="message" id="message">MÃ CODE KHÔNG HỢP LỆ</p><div class="reward" id="reward" hidden></div><div><button type="button" id="close">XÁC NHẬN</button></div><div class="note" id="note"></div></div></div><script src="config.js"></script><script>
// Supply a secure server-side verification endpoint. Never embed valid codes or API secrets in public HTML.
const API_URL='/api/verify';
// Dán Site Key công khai từ Cloudflare Turnstile (không dán Secret Key ở đây).
const TURNSTILE_SITE_KEY=window.E39_CONFIG?.turnstileSiteKey || '';
const turnstileIds=new Map();
let turnstileLoaded=false;
function onTurnstileLoaded(){turnstileLoaded=true;setupTurnstile()}
function setupTurnstile(){if(!turnstileLoaded||!TURNSTILE_SITE_KEY)return;document.querySelectorAll('.verification').forEach((wrap,i)=>{if(turnstileIds.has(wrap))return;wrap.querySelector('.verify-setup').hidden=true;wrap.classList.add('is-ready');const id=turnstile.render(wrap.querySelector('.verify-widget'),{sitekey:TURNSTILE_SITE_KEY,theme:'light',size:'normal','expired-callback':()=>{},'error-callback':()=>{}});turnstileIds.set(wrap,id)})}

const links={home:'',contact:'',telegram:'',fanpage:''};
document.querySelectorAll('[data-link]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();let url=links[el.dataset.link];if(url)location.href=url;else alert('Liên kết chưa được cấu hình.')}));
const modal=document.getElementById('modal'),dialog=document.getElementById('dialog');
function result(data){let ok=data.valid===true;dialog.classList.toggle('success',ok);document.getElementById('icon').textContent=ok?'✅':'❌';document.getElementById('resultTitle').textContent=ok?'CHÚC MỪNG':'NHẬP MÃ KHUYẾN MÃI';document.getElementById('message').textContent=ok?((data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit'))?'Bạn đã nhận được':'MÃ CODE HỢP LỆ'):data.reason==='code_expired'?'CODE ĐÃ HẾT HẠN':data.reason==='code_not_configured'?'CODE CHƯA ĐƯỢC KÍCH HOẠT':data.reason==='generated_code_requires_deposit'?'TÀI KHOẢN CỦA BẠN CHƯA NẠP TIỀN NÊN KHÔNG THỂ NHẬN CODE':data.reason==='deposit_required'?'TÀI KHOẢN CỦA BẠN CẦN NẠP ĐỦ '+new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' VND ĐỂ NHẬN CODE NÀY':data.reason==='account_not_found'?'TÀI KHOẢN KHÔNG TỒN TẠI':['invalid_code','code_used','code_expired','already_redeemed','expired_code','used_code'].includes(data.reason)?'CODE ĐÃ SỬ DỤNG HẾT HOẶC ĐÃ HẾT HẠN':data.reason==='turnstile_not_configured'?'CHƯA CẤU HÌNH XÁC MINH CLOUDFLARE':data.reason==='code_service_not_configured'?'CHƯA KẾT NỐI DỮ LIỆU MÃ':'CHƯA THỂ XÁC MINH MÃ';let reward=document.getElementById('reward');reward.hidden=!(ok&&(data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit')));reward.textContent=ok&&(data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit'))?new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' VNĐ':'';document.getElementById('note').textContent='';modal.hidden=false;document.getElementById('close').focus()}
document.getElementById('close').addEventListener('click',()=>modal.hidden=true);modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true});
async function submit(form){const account=form.elements.account.value.trim(),code=form.elements.code.value.trim();if(!account||!code)return;if(!TURNSTILE_SITE_KEY){result({valid:false,reason:'service_unavailable',note:'Chưa cấu hình Cloudflare Turnstile Site Key.'});return;}const wrap=form.querySelector('.verification');const widgetId=turnstileIds.get(wrap);const token=widgetId!==undefined&&window.turnstile?turnstile.getResponse(widgetId):'';if(!token){result({valid:false,reason:'service_unavailable',note:'Vui lòng hoàn tất xác minh Cloudflare trước khi kiểm tra.'});return;}if(!API_URL){result({valid:false,reason:'service_unavailable',note:'Chưa kết nối máy chủ xác minh mã code.'});return;}let button=form.querySelector('[type=submit]');button.disabled=true;try{let response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account,code,turnstileToken:token})});let data=await response.json();if(!response.ok&&typeof data.valid!=='boolean')throw Error('HTTP '+response.status);if(typeof data.valid!=='boolean')throw Error('Invalid result');result(data)}catch(e){result({valid:false,reason:'service_unavailable',note:''})}finally{button.disabled=false;if(widgetId!==undefined&&window.turnstile)turnstile.reset(widgetId)}}
['desktopForm','mobileForm'].forEach(id=>document.getElementById(id).addEventListener('submit',e=>{e.preventDefault();submit(e.currentTarget)}));
</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoaded&render=explicit" async defer></script></body></html>
