<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E39 | Page nhập code</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8ef}.stage{width:100%;aspect-ratio:1903/911;position:relative;background:url('reference.png') center/100% 100% no-repeat;overflow:hidden}.nav{position:absolute;top:1.5%;height:6%;border:0;background:transparent;cursor:pointer}.home{left:41%;width:8%}.contact{left:49.7%;width:8%}.telegram{left:58.1%;width:9%}.fanpage{left:66.4%;width:9%}
/* Only overlay editable inner input areas; original artwork, labels and panel stay visible. */
.desktop-form{position:absolute;inset:0;pointer-events:none}.field{position:absolute;left:36.6%;width:26.3%;height:3.8%;border:0;outline:0;background:#fff;border-radius:6px;color:#333;font-size:clamp(11px,.85vw,17px);padding:0 .7%;pointer-events:auto}.field::placeholder{color:#999}.field:focus{box-shadow:0 0 0 2px #ff9a24}.account{top:43.9%}.code{top:52.35%}.verify{position:absolute;left:44.35%;top:57%;width:11.2%;height:5.2%;background:#f7f7f7;border:1px solid #dedede;display:flex;align-items:center;justify-content:center;color:#777;font-size:clamp(7px,.55vw,11px);pointer-events:none}.check{position:absolute;left:43%;top:63%;width:14%;height:6.6%;border:0;border-radius:40px;background:transparent;cursor:pointer;pointer-events:auto}.check:focus-visible{outline:3px solid #155fd0;outline-offset:2px}.watermark{position:absolute;right:1.4%;bottom:2.2%;width:17%;height:9%;background:linear-gradient(90deg,transparent 0%,#f6e9dbb8 18%,#f3d5b7e8 70%,transparent 100%);filter:blur(5px);pointer-events:none}
.mobile{display:none}.result-overlay[hidden]{display:none}.result-overlay{position:fixed;inset:0;z-index:20;background:#000b;display:grid;place-items:center;padding:20px}.result-box{position:relative;width:min(450px,95vw);background:linear-gradient(#fff,#fffaf4);border:7px ridge #ff8b18;border-radius:36px;box-shadow:0 0 0 3px #fff0bb,0 12px 35px #0006;text-align:center;padding:70px 20px 28px}.result-box:before{content:'🎁';position:absolute;top:-54px;left:50%;transform:translateX(-50%);font-size:85px}.result-icon{font-size:43px}.result-title{font-size:19px;color:#46566b;font-weight:900;margin:8px 0}.result-message{font-size:19px;color:#ed3434;font-weight:900;margin:0 0 16px}.result-box.success .result-message,.result-box.success .result-title{color:#0ba76a}.reward{display:inline-block;background:#fffdf4;border-radius:28px;padding:6px 34px;color:#ff8c00;font-size:29px;font-weight:900;margin:0 0 16px}.reward[hidden]{display:none}.result-box button{border:2px solid #ffad39;border-radius:12px;background:linear-gradient(#ffbd4b,#ff7d13);color:white;padding:12px 35px;font-size:17px;font-weight:900;cursor:pointer}.result-note{font-size:12px;color:#777;margin-top:12px}
@media(max-width:700px){.stage{min-height:100svh;aspect-ratio:auto;background-size:auto 100%;background-position:center}.desktop{display:none}.mobile{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 14px;background:#fff8ef9e}.mobile-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.mobile-header strong{font-size:40px;color:#ff8317}.mobile-links{display:flex;gap:10px;flex-wrap:wrap}.mobile-links a{font-size:12px;color:#754b25;text-decoration:none;font-weight:bold}.mobile-form{margin:auto 0;background:#fff9ed;border:5px solid #ffb62b;border-radius:27px;padding:25px 18px;box-shadow:0 12px 35px #c27b1a55}.mobile-form h1{text-align:center;font-size:29px;color:#ff7a0b;margin:0 0 20px}.mobile-form label{display:block;color:#ff7000;font-size:14px;font-weight:bold;margin:14px 0 7px}.mobile-form input{width:100%;height:47px;padding:0 12px;border:2px solid #ff9224;border-radius:12px;font-size:16px}.mobile-form .verification{width:210px;padding:12px;margin:18px auto;background:#f7f7f7;text-align:center;font-size:12px;color:#666}.mobile-form button{width:100%;padding:12px 8px;border:3px solid #ffdda4;border-radius:40px;background:linear-gradient(#ffbc5a,#ff7b0d);color:#fff;font-size:23px;font-weight:900}}

/* FIX: opaque unified panel hides every baked-in field and fake verification. */
.desktop-form{position:absolute;left:34.75%;top:39.55%;width:30.65%;height:30.55%;padding:1.15% 1.5% 0;pointer-events:auto;background:#fffaf0;border:3px solid #ffe5ad;border-radius:27px;display:flex;flex-direction:column;justify-content:center;gap:1.05%;box-shadow:0 2px 8px #f0b74b33}
.desktop-form label{display:block;color:#ff6c00;font-weight:700;font-size:clamp(11px,.86vw,16px);margin:0 0 1px}
.desktop-form .input-line{display:flex;align-items:center;gap:10px;height:clamp(29px,5.1vh,45px);background:white;border:2px solid #ff8d26;border-radius:13px;padding:0 12px;margin-bottom:1.2%}
.desktop-form .input-line span{color:#555;font-size:15px}
.desktop-form .input-line input{width:100%;height:100%;border:0;outline:0;background:transparent;font-size:clamp(12px,.82vw,16px);color:#333;min-width:0}
.desktop-form .input-line:focus-within{box-shadow:0 0 0 2px #ffca81}
.desktop-form .verify{position:static;align-self:center;width:210px;max-width:60%;height:clamp(28px,4.8vh,43px);background:#f7f7f7;border:1px solid #ddd;font-size:clamp(9px,.65vw,12px);display:flex;align-items:center;justify-content:center;color:#666;pointer-events:none;margin:0 auto 1%}
.desktop-form .check{position:static;align-self:center;width:52%;height:clamp(39px,6.7vh,60px);border:3px solid #ffd999;border-radius:40px;background:linear-gradient(#ffc269 0%,#ff951f 46%,#ff7d0e 100%);box-shadow:inset 0 0 0 2px #fff7e5,0 3px 7px #bb65065c;color:white;text-shadow:0 2px 2px #d66a00;font-size:clamp(13px,1.42vw,27px);font-weight:900;white-space:nowrap;cursor:pointer;pointer-events:auto}
.desktop-form .check:hover{filter:brightness(1.05)}
.desktop-form .check:focus-visible{outline:3px solid #175ed0;outline-offset:3px}
@media(max-width:1100px) and (min-width:701px){.desktop-form{padding:1% 1.3%;gap:0}.desktop-form .input-line{height:25%;margin-bottom:1%}.desktop-form .verify{height:16%}.desktop-form .check{height:23%}}
</style></head><body><main class="stage"><div class="desktop"><button class="nav home" data-link="home" aria-label="Trang Chủ"></button><button class="nav contact" data-link="contact" aria-label="Liên Hệ"></button><button class="nav telegram" data-link="telegram" aria-label="Telegram"></button><button class="nav fanpage" data-link="fanpage" aria-label="Fanpage"></button><form class="desktop-form" id="desktopForm"><label for="account">Nhập tên tài khoản</label><div class="input-line"><span aria-hidden="true">♟</span><input id="account" name="account" placeholder="Nhập tài khoản" autocomplete="username" required></div><label for="code">Điền mã code nhận thưởng</label><div class="input-line"><span aria-hidden="true">▣</span><input id="code" name="code" placeholder="Mã code" required></div><div class="verify">Chưa kết nối xác minh</div><button class="check" type="submit">KIỂM TRA NGAY</button></form><div class="watermark" aria-hidden="true"></div></div><div class="mobile"><header class="mobile-header"><strong>E39</strong><nav class="mobile-links"><a href="#" data-link="home">Trang Chủ</a><a href="#" data-link="contact">Liên Hệ</a><a href="#" data-link="telegram">Telegram</a><a href="#" data-link="fanpage">Fanpage</a></nav></header><form class="mobile-form" id="mobileForm"><h1>Page nhập code 🎁</h1><label for="mAccount">Nhập tên tài khoản</label><input id="mAccount" name="account" placeholder="Nhập tài khoản" required><label for="mCode">Điền mã code nhận thưởng</label><input id="mCode" name="code" placeholder="Mã code" required><div class="verification">Chưa kết nối xác minh</div><button type="submit">KIỂM TRA NGAY</button></form></div></main><div class="result-overlay" id="resultOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="result-box" id="resultBox"><div class="result-icon" id="resultIcon">❌</div><h2 class="result-title" id="resultTitle">NHẬP MÃ KHUYẾN MÃI</h2><p class="result-message" id="resultMessage">MÃ CODE KHÔNG HỢP LỆ</p><div class="reward" id="resultReward" hidden></div><div><button id="resultClose" type="button">XÁC NHẬN</button></div><p class="result-note" id="resultNote"></p></div></div><script>
// Điền API_URL để xác minh thật trên máy chủ của bạn. API phải trả JSON:
// {"valid":true,"amount":58,"currency":"VND"} hoặc {"valid":false,"reason":"invalid_code"|"account_not_found"}.
// Không lưu danh sách mã hợp lệ hoặc khóa bí mật trong HTML công khai.
const API_URL = '';
const links={home:'',contact:'',telegram:'',fanpage:''};
document.querySelectorAll('[data-link]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();const url=links[el.dataset.link];if(url)location.href=url;else alert('Liên kết này chưa được cấu hình.')}));
const overlay=document.getElementById('resultOverlay'), box=document.getElementById('resultBox'), icon=document.getElementById('resultIcon'), title=document.getElementById('resultTitle'),message=document.getElementById('resultMessage'),reward=document.getElementById('resultReward'),note=document.getElementById('resultNote');
function showResult(data){
 const valid=data.valid===true;box.classList.toggle('success',valid);icon.textContent=valid?'✅':'❌';title.textContent=valid?'CHÚC MỪNG':'NHẬP MÃ KHUYẾN MÃI';
 message.textContent=valid?'Bạn đã nhận được':data.reason==='account_not_found'?'TÀI KHOẢN KHÔNG TỒN TẠI':data.reason==='missing'?'VUI LÒNG NHẬP ĐỦ THÔNG TIN':data.reason==='service_unavailable'?'CHƯA THỂ XÁC MINH MÃ':'MÃ CODE KHÔNG HỢP LỆ';
 reward.hidden=!valid;reward.textContent=valid?new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' '+(data.currency||'VND'):'';
 note.textContent=data.note||'';overlay.hidden=false;document.getElementById('resultClose').focus();
}
document.getElementById('resultClose').addEventListener('click',()=>overlay.hidden=true);
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.hidden=true});
async function submit(form){
 const account=form.elements.account.value.trim(),code=form.elements.code.value.trim();
 if(!account||!code){showResult({valid:false,reason:'missing'});return;}
 if(!API_URL){showResult({valid:false,reason:'service_unavailable',note:'Cần kết nối API xác minh để kiểm tra mã và hiển thị phần thưởng thực tế.'});return;}
 const button=form.querySelector('[type=submit]');button.disabled=true;
 try{const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account,code})});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(typeof data.valid!=='boolean')throw Error('Invalid response');showResult(data)}catch(e){showResult({valid:false,reason:'service_unavailable',note:'Vui lòng thử lại sau.'})}finally{button.disabled=false}
}
for(const id of ['desktopForm','mobileForm'])document.getElementById(id).addEventListener('submit',e=>{e.preventDefault();submit(e.currentTarget)});
</script></body></html>
