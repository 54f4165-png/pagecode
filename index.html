<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E39 - Page nhập code</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fff7ed;overflow-x:hidden}
.stage{width:100%;aspect-ratio:1024/572;position:relative;background:url('remini-original.webp') center top / 100% 100% no-repeat;}
.hit{position:absolute;top:0;height:8.6%;background:transparent;border:0;cursor:pointer;z-index:2}
.hit.home{left:40.7%;width:9%}.hit.contact{left:50.3%;width:8%}.hit.telegram{left:58.3%;width:8.7%}.hit.fanpage{left:66.5%;width:9.3%}
.desktop-form{position:absolute;left:36.3%;top:45.3%;width:27.5%;height:27.5%;display:block}
.desktop-form .group{position:absolute;left:0;width:100%;height:17.5%}.desktop-form .group.first{top:0}.desktop-form .group.second{top:32.4%}
.desktop-form label{display:none}.desktop-form .line{width:100%;height:100%;display:flex;align-items:center;padding:0 10px 0 25px}
.desktop-form input{border:0;background:transparent;outline:0;width:100%;height:100%;font-size:clamp(11px,1.05vw,16px);color:#242424}
.desktop-form input::placeholder{color:transparent}.desktop-form input:focus{background:#ffffffef;border-radius:5px;outline:2px solid #ffa027}
.desktop-form .verification{position:absolute;left:27%;top:62%;width:46%;height:19%;min-width:240px;transform:translateX(-10%);display:flex;align-items:center;justify-content:center;background:#fff;overflow:visible}
.verify-widget{display:flex;justify-content:center;width:100%}.verify-setup{font-size:10px;text-align:center;color:#555}
.desktop-form .submit{position:absolute;left:23%;top:90%;width:54%;height:22%;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:60px}
.desktop-form .submit:focus-visible{outline:3px solid #0a8dff}.desktop-form .submit:disabled{cursor:wait}
.mobile-layout{display:none}
.modal[hidden]{display:none}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:20px}
.dialog{position:relative;background:linear-gradient(#fff,#fffaf4);border:7px ridge #ff8b18;border-radius:35px;box-shadow:0 0 0 3px #fff0bb,0 15px 45px #0005;text-align:center;width:min(460px,94vw);padding:70px 20px 32px}
.dialog:before{content:'🎁';position:absolute;top:-56px;left:50%;transform:translateX(-50%);font-size:85px}.status-icon{font-size:42px}.dialog h2{font-size:19px;color:#46566b;margin:8px 0}.message{font-size:20px;line-height:1.4;color:#ec3434;font-weight:800;margin:0 0 15px;overflow-wrap:break-word}.dialog.success h2,.dialog.success .message{color:#0aab71}.reward{display:inline-block;background:#fffdf1;border-radius:40px;padding:6px 35px;color:#ff9000;font-size:30px;font-weight:900;margin:0 0 14px}.reward[hidden]{display:none}.dialog button{border:2px solid #ffad39;border-radius:12px;background:linear-gradient(#ffbd4b,#ff7d13);color:#fff;font-size:17px;font-weight:900;padding:12px 35px;cursor:pointer}.note{display:none!important}
@media(max-width:900px){
 .stage{display:none}
 .mobile-layout{display:block;min-height:100svh;background:#fff8ec}
 .mobile-header{background:#202020;color:white;text-align:center}
 .mobile-logo{font-size:52px;font-weight:1000;letter-spacing:-3px;color:#fa8519;padding:8px}
 .mobile-nav{display:flex;justify-content:space-around;align-items:center;gap:4px;border-top:1px solid #4a4a4a;padding:12px 3px}
 .mobile-nav a{font-size:clamp(10px,2.6vw,14px);color:#eee;text-decoration:none;white-space:nowrap;font-weight:600}
 .mobile-nav .ico{display:inline-block;margin-right:4px}
 .mobile-main{background:linear-gradient(180deg,#fff4dc,#ffe2a5);padding:20px 12px 0}
 .mobile-title{color:#fff;text-align:center;font-size:clamp(28px,7vw,44px);font-style:italic;font-weight:1000;line-height:1.15;white-space:nowrap;-webkit-text-stroke:1.3px #d96b05;text-shadow:0 3px #ffb62c,0 5px #ae500c;margin:4px auto 14px}
 .mobile-form{max-width:520px;margin:auto;padding:19px 16px 20px;background:linear-gradient(#fff9ef,#fff6e7);border:9px solid #ffbb2c;outline:2px solid #e88e13;border-radius:24px;box-shadow:0 6px 14px #ad751c50;display:flex;flex-direction:column;gap:8px}
 .mobile-form label{display:block;color:#ff7300;font-weight:700;font-size:15px;margin-bottom:4px}
 .mobile-form .line{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #f89928;border-radius:10px;height:48px;padding:0 12px}
 .mobile-form .line input{width:100%;min-width:0;border:0;outline:0;font-size:16px;background:transparent;color:#333}
 .mobile-form .verification{display:flex;align-items:center;justify-content:center;min-height:70px;max-width:100%;overflow:hidden}
 .mobile-form .submit{align-self:center;border:3px solid #ffdda1;border-radius:35px;background:linear-gradient(#ffc66d,#ff7a09);color:#fff;text-shadow:0 1px #aa4b00;box-shadow:0 3px 5px #a65c18a8;font-size:20px;font-weight:900;min-height:51px;width:min(100%,290px);cursor:pointer}
 .mobile-scenery{margin-top:18px;width:100%;height:min(72vw,390px);background:url('remini-original.webp') center bottom / auto 190% no-repeat}
}
</style></head><body><main class="stage" aria-label="E39 - Page nhập code">
<button class="hit home" data-link="home" aria-label="Trang Chủ"></button><button class="hit contact" data-link="contact" aria-label="Liên Hệ"></button><button class="hit telegram" data-link="telegram" aria-label="Telegram"></button><button class="hit fanpage" data-link="fanpage" aria-label="Fanpage"></button>
<form class="desktop-form" id="desktopForm"><div class="group first"><label for="account">Nhập tên tài khoản</label><div class="line"><input id="account" name="account" aria-label="Nhập tài khoản" placeholder="Nhập tài khoản" required autocomplete="username"></div></div><div class="group second"><label for="code">Điền mã code nhận thưởng</label><div class="line"><input id="code" name="code" aria-label="Mã code" placeholder="Mã code" maxlength="6" minlength="6" pattern="[A-Za-z]{6}" required></div></div><div class="verification"><div class="verify-widget"></div><div class="verify-setup">Xác minh Cloudflare chưa được cấu hình</div></div><button class="submit" type="submit" aria-label="KIỂM TRA NGAY">KIỂM TRA NGAY</button></form></main>
<div class="mobile-layout"><header class="mobile-header"><div class="mobile-logo">E39</div><nav class="mobile-nav"><a href="#" data-link="home"><span class="ico">🏠</span>Trang Chủ</a><a href="#" data-link="contact"><span class="ico">📣</span>Liên Hệ</a><a href="#" data-link="telegram"><span class="ico">✈️</span>Telegram</a><a href="#" data-link="fanpage"><span class="ico">🟠</span>Fanpage</a></nav></header><section class="mobile-main"><h1 class="mobile-title">🎁 Page nhập code</h1><form class="mobile-form" id="mobileForm"><div><label for="mAccount">Nhập tên tài khoản</label><div class="line"><span>♟</span><input id="mAccount" name="account" placeholder="Nhập tài khoản" required autocomplete="username"></div></div><div><label for="mCode">Điền mã code nhận thưởng</label><div class="line"><span>▣</span><input id="mCode" name="code" placeholder="Mã code" maxlength="6" minlength="6" pattern="[A-Za-z]{6}" required></div></div><div class="verification"><div class="verify-widget"></div><div class="verify-setup">Xác minh Cloudflare chưa được cấu hình</div></div><button class="submit" type="submit">KIỂM TRA NGAY</button></form></section><div class="mobile-scenery" aria-hidden="true"></div></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="dialog" id="dialog"><div class="status-icon" id="icon">❌</div><h2 id="resultTitle">NHẬP MÃ KHUYẾN MÃI</h2><p class="message" id="message">MÃ CODE KHÔNG HỢP LỆ</p><div class="reward" id="reward" hidden></div><div><button type="button" id="close">XÁC NHẬN</button></div><div class="note" id="note"></div></div></div><script src="config.js"></script><script>
// Supply a secure server-side verification endpoint. Never embed valid codes or API secrets in public HTML.
const API_URL='/api/verify';
// Dán Site Key công khai từ Cloudflare Turnstile (không dán Secret Key ở đây).
const TURNSTILE_SITE_KEY=window.E39_CONFIG?.turnstileSiteKey || '';
const turnstileIds=new Map();
let turnstileLoaded=false;
function onTurnstileLoaded(){turnstileLoaded=true;setupTurnstile()}
function setupTurnstile(){if(!turnstileLoaded||!TURNSTILE_SITE_KEY)return;document.querySelectorAll('.verification').forEach((wrap,i)=>{if(turnstileIds.has(wrap))return;wrap.querySelector('.verify-setup').hidden=true;wrap.classList.add('is-ready');const id=turnstile.render(wrap.querySelector('.verify-widget'),{sitekey:TURNSTILE_SITE_KEY,theme:'light',size:'normal','expired-callback':()=>{},'error-callback':()=>{}});turnstileIds.set(wrap,id)})}

const links={home:'',contact:'',telegram:'',fanpage:''};
document.querySelectorAll('[data-link]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();let url=links[el.dataset.link];if(url)location.href=url;else alert('Liên kết chưa được cấu hình.')}));
const modal=document.getElementById('modal'),dialog=document.getElementById('dialog');
function result(data){let ok=data.valid===true;dialog.classList.toggle('success',ok);document.getElementById('icon').textContent=ok?'✅':'❌';document.getElementById('resultTitle').textContent=ok?'CHÚC MỪNG':'NHẬP MÃ KHUYẾN MÃI';document.getElementById('message').textContent=ok?((data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit'))?'Bạn đã nhận được':'MÃ CODE HỢP LỆ'):data.reason==='code_expired'?'CODE ĐÃ HẾT HẠN':data.reason==='code_not_configured'?'CODE CHƯA ĐƯỢC KÍCH HOẠT':data.reason==='generated_code_requires_deposit'?'TÀI KHOẢN CỦA BẠN CHƯA NẠP TIỀN NÊN KHÔNG THỂ NHẬN CODE':data.reason==='deposit_required'?'TÀI KHOẢN CỦA BẠN CẦN NẠP ĐỦ '+new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' VND ĐỂ NHẬN CODE NÀY':data.reason==='account_not_found'?'TÀI KHOẢN KHÔNG TỒN TẠI':['invalid_code','code_used','code_expired','already_redeemed','expired_code','used_code'].includes(data.reason)?'CODE ĐÃ SỬ DỤNG HẾT HOẶC ĐÃ HẾT HẠN':data.reason==='turnstile_not_configured'?'CHƯA CẤU HÌNH XÁC MINH CLOUDFLARE':data.reason==='code_service_not_configured'?'CHƯA KẾT NỐI DỮ LIỆU MÃ':'CHƯA THỂ XÁC MINH MÃ';let reward=document.getElementById('reward');reward.hidden=!(ok&&(data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit')));reward.textContent=ok&&(data.type==='bonus'||(Number(data.amount)>0&&data.type!=='deposit'))?new Intl.NumberFormat('vi-VN').format(Number(data.amount)||0)+' VNĐ':'';document.getElementById('note').textContent='';modal.hidden=false;document.getElementById('close').focus()}
document.getElementById('close').addEventListener('click',()=>modal.hidden=true);modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true});
async function submit(form){const account=form.elements.account.value.trim(),code=form.elements.code.value.trim();if(!account||!code)return;if(!TURNSTILE_SITE_KEY){result({valid:false,reason:'service_unavailable',note:'Chưa cấu hình Cloudflare Turnstile Site Key.'});return;}const wrap=form.querySelector('.verification');const widgetId=turnstileIds.get(wrap);const token=widgetId!==undefined&&window.turnstile?turnstile.getResponse(widgetId):'';if(!token){result({valid:false,reason:'service_unavailable',note:'Vui lòng hoàn tất xác minh Cloudflare trước khi kiểm tra.'});return;}if(!API_URL){result({valid:false,reason:'service_unavailable',note:'Chưa kết nối máy chủ xác minh mã code.'});return;}let button=form.querySelector('[type=submit]');button.disabled=true;try{let response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account,code,turnstileToken:token})});let data=await response.json();if(!response.ok&&typeof data.valid!=='boolean')throw Error('HTTP '+response.status);if(typeof data.valid!=='boolean')throw Error('Invalid result');result(data)}catch(e){result({valid:false,reason:'service_unavailable',note:''})}finally{button.disabled=false;if(widgetId!==undefined&&window.turnstile)turnstile.reset(widgetId)}}
['desktopForm','mobileForm'].forEach(id=>document.getElementById(id).addEventListener('submit',e=>{e.preventDefault();submit(e.currentTarget)}));
</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoaded&render=explicit" async defer></script></body></html>
